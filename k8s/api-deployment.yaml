apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommender-api
  namespace: movie-rec
  labels:
    app: recommender-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: recommender-api
  template:
    metadata:
      labels:
        app: recommender-api
    spec:
      containers:
        - name: api
          image: movie-recommender-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: recommender-config
          env:
            - name: POSTGRES_PASSWORD
              value: "movie_rec_pass_2024"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: recommender-api-service
  namespace: movie-rec
spec:
  type: ClusterIP
  selector:
    app: recommender-api
  ports:
    - port: 8000
      targetPort: 8000
