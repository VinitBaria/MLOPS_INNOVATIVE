global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'movie-recommender-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']
        labels:
          app: 'movie-recommender'
          env: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
