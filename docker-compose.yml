version: '3.8'

services:
  # ─── PostgreSQL Database ───
  postgres:
    image: postgres:15-alpine
    container_name: movie_rec_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: movie_rec_user
      POSTGRES_PASSWORD: movie_rec_pass_2024
      POSTGRES_DB: movie_rec_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_rec_user -d movie_rec_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MLflow Tracking Server ───
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: movie_rec_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=sqlite:////mlflow/mlflow.db
      - DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000

  # ─── Recommendation API (FastAPI) ───
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie_rec_api
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=movie_rec_db
      - POSTGRES_USER=movie_rec_user
      - POSTGRES_PASSWORD=movie_rec_pass_2024
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - RETRAIN_THRESHOLD_NEW_RATINGS=50
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    volumes:
      - ./models:/app/models
      - ./data:/app/data

  # ─── NGINX Reverse Proxy ───
  nginx:
    image: nginx:alpine
    container_name: movie_rec_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  # ─── Prometheus Monitoring ───
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: movie_rec_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - api

  # ─── Grafana Dashboard ───
  grafana:
    image: grafana/grafana:10.2.0
    container_name: movie_rec_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./docker/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  mlflow_data:
  prometheus_data:
  grafana_data:
